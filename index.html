<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackWell Countdown</title>
    <link rel="icon" type="image/jpeg" href="assets/had-logo.jpeg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Typography Setup */
        @font-face {
            font-family: 'HackwellTitleFont';
            src: url('assets/avengersfont/AvengeanceHeroicAvengerNormal-Bz7d.ttf') format('truetype');
        }

        @font-face {
            font-family: 'HackwellTitleFont';
            src: url('assets/Neo.ttf') format('truetype');
            unicode-range: U+0041, U+0061;
            /* Capital A and lowercase a */
        }

        @font-face {
            font-family: 'MondayFont';
            src: url('assets/Monday.ttf') format('truetype');
        }

        /* Layout & Background */
        body {
            margin: 0;
            padding: 0;
            background-image: url('assets/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0B0F1A;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .center-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* Glitch Text styling */
        .hero-title {
            font-family: 'HackwellTitleFont', sans-serif;
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: normal;
            line-height: 1;
            margin: 10vh 0 2rem 0;
            color: #fff;
            position: relative;
            display: inline-block;
            text-transform: uppercase;
            filter: drop-shadow(0 0 25px rgba(37, 99, 235, 0.5));
            letter-spacing: 5px;
        }

        .hero-title::before,
        .hero-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            opacity: 0.8;
        }

        .hero-title::before {
            left: 2px;
            text-shadow: -2px 0 #ff00c1;
            animation: glitch-anim-1 20s infinite linear alternate-reverse;
        }

        .hero-title::after {
            left: -2px;
            text-shadow: 2px 0 #00fff9;
            animation: glitch-anim-2 30s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% {
                clip-path: inset(20% 0 80% 0);
            }

            5% {
                clip-path: inset(10% 0 10% 0);
            }

            10% {
                clip-path: inset(80% 0 5% 0);
            }

            15% {
                clip-path: inset(40% 0 40% 0);
            }

            20% {
                clip-path: inset(60% 0 20% 0);
            }

            25% {
                clip-path: inset(15% 0 80% 0);
            }

            30% {
                clip-path: inset(90% 0 5% 0);
            }

            35% {
                clip-path: inset(30% 0 60% 0);
            }

            40% {
                clip-path: inset(70% 0 20% 0);
            }

            45% {
                clip-path: inset(10% 0 80% 0);
            }

            50% {
                clip-path: inset(50% 0 30% 0);
            }

            55% {
                clip-path: inset(80% 0 5% 0);
            }

            60% {
                clip-path: inset(5% 0 85% 0);
            }

            65% {
                clip-path: inset(40% 0 40% 0);
            }

            70% {
                clip-path: inset(90% 0 10% 0);
            }

            75% {
                clip-path: inset(20% 0 60% 0);
            }

            80% {
                clip-path: inset(60% 0 30% 0);
            }

            85% {
                clip-path: inset(10% 0 70% 0);
            }

            90% {
                clip-path: inset(70% 0 20% 0);
            }

            95% {
                clip-path: inset(30% 0 50% 0);
            }

            100% {
                clip-path: inset(5% 0 90% 0);
            }
        }

        @keyframes glitch-anim-2 {
            0% {
                clip-path: inset(10% 0 60% 0);
            }

            5% {
                clip-path: inset(80% 0 5% 0);
            }

            10% {
                clip-path: inset(30% 0 40% 0);
            }

            15% {
                clip-path: inset(70% 0 10% 0);
            }

            20% {
                clip-path: inset(5% 0 90% 0);
            }

            25% {
                clip-path: inset(50% 0 30% 0);
            }

            30% {
                clip-path: inset(20% 0 70% 0);
            }

            35% {
                clip-path: inset(90% 0 5% 0);
            }

            40% {
                clip-path: inset(15% 0 80% 0);
            }

            45% {
                clip-path: inset(60% 0 20% 0);
            }

            50% {
                clip-path: inset(40% 0 40% 0);
            }

            55% {
                clip-path: inset(5% 0 85% 0);
            }

            60% {
                clip-path: inset(80% 0 10% 0);
            }

            65% {
                clip-path: inset(30% 0 50% 0);
            }

            70% {
                clip-path: inset(70% 0 20% 0);
            }

            75% {
                clip-path: inset(10% 0 60% 0);
            }

            80% {
                clip-path: inset(50% 0 30% 0);
            }

            85% {
                clip-path: inset(90% 0 5% 0);
            }

            90% {
                clip-path: inset(20% 0 70% 0);
            }

            95% {
                clip-path: inset(60% 0 20% 0);
            }

            100% {
                clip-path: inset(15% 0 80% 0);
            }
        }

        /* Quote Text */
        .quote {
            font-family: 'MondayFont', sans-serif;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            letter-spacing: 1px;
            line-height: 1.5;
            color: #fff;
        }

        .quote .line-2 {
            display: block;
            font-size: 1rem;
            margin-top: 0.5rem;
            color: var(--accent-glow, #60A5FA);
        }

        /* Countdown Timer */
        .timer-container {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(17, 24, 39, 0.4);
            backdrop-filter: blur(5px);
            padding: 1.5rem 1rem;
            border-radius: 10px;
            min-width: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.1s ease;
        }

        .time-value {
            font-family: 'Space Grotesk', sans-serif, monospace;
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
            color: #fff;
        }

        .time-label {
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            color: #9CA3AF;
            margin-top: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .colon {
            font-size: 3rem;
            font-weight: 700;
            color: #60A5FA;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        /* Animation class for numbers */
        .scale-pop {
            animation: pop 0.25s ease-out;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
                color: #fff;
            }

            100% {
                transform: scale(1);
            }
        }

        /* Optional: Add a dark overlay so text is more readable against bg */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 1;
        }

        /* Loading animation for fonts */
        .center-container {
            opacity: 0;
            animation: fadeIn 1s ease-in forwards;
            animation-delay: 0.2s;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* Timer Overrides */
        .flip-timer {
            transform: scale(0.85);
        }
        
        .flip-timer .top-bg, 
        .flip-timer .bot-bg, 
        .flip-timer .leaf-top, 
        .flip-timer .leaf-bot,
        .flip-timer .segment {
            background-color: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 15vw;
                letter-spacing: 2px;
                margin-top: 5vh;
            }

            .quote {
                font-size: 0.8rem;
            }

            .quote .line-2 {
                font-size: 1rem;
            }

            .flip-timer {
                transform: scale(0.75);
            }
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <div class="center-container">
        <!-- HACKWELL Glitching Text -->
        <a href="index2.html"><h1 class="hero-title" data-text="HACKWELL">HACKWELL</h1></a>

        <!-- Quote -->
        <div class="quote">
            All of you have lived stolen lives and now you must give them back.
            <span class="line-2">Get ready...</span>
        </div>

        <!-- Timer -->
        <div class="flip-timer">
                <div class="flip-unit" id="days">
                    <div class="flip-card">
                        <div class="segment top-bg">00</div>
                        <div class="segment bot-bg">00</div>
                        <div class="segment leaf-top">00</div>
                        <div class="segment leaf-bot">00</div>
                    </div>
                    <div class="label">DAYS</div>
                </div>
                <div class="colon">:</div>
                <div class="flip-unit" id="hours">
                    <div class="flip-card">
                        <div class="segment top-bg">00</div>
                        <div class="segment bot-bg">00</div>
                        <div class="segment leaf-top">00</div>
                        <div class="segment leaf-bot">00</div>
                    </div>
                    <div class="label">HOURS</div>
                </div>
                <div class="colon">:</div>
                <div class="flip-unit" id="mins">
                    <div class="flip-card">
                        <div class="segment top-bg">00</div>
                        <div class="segment bot-bg">00</div>
                        <div class="segment leaf-top">00</div>
                        <div class="segment leaf-bot">00</div>
                    </div>
                    <div class="label">MINUTES</div>
                </div>
                <div class="colon">:</div>
                <div class="flip-unit" id="secs">
                    <div class="flip-card">
                        <div class="segment top-bg">00</div>
                        <div class="segment bot-bg">00</div>
                        <div class="segment leaf-top">00</div>
                        <div class="segment leaf-bot">00</div>
                    </div>
                    <div class="label">SECONDS</div>
                </div>
            </div>
    </div>

    <!-- Countdown Script -->
    <script src="js/script.js"></script>
</body>

</html>
